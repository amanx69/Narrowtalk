
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verified | TeamMatch</title>
    <style>
        :root {
            --bg: #ecfdf5;
            --card: rgba(255, 255, 255, 0.9);
            --border: rgba(16, 185, 129, 0.12);
            --text: #111827;
            --muted: #6b7280;
            --success: #10b981;
            --success-dark: #047857;
            --primary: #4f46e5;
            --shadow: 0 20px 45px rgba(16, 185, 129, 0.14);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Inter, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #ecfdf5 0%, #f9fafb 100%);
            color: var(--text);
        }

        .card {
            width: min(92vw, 460px);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 26px;
            padding: 32px 28px;
            text-align: center;
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
        }

        .badge {
            width: 88px;
            height: 88px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            font-size: 40px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 2.3rem);
            font-weight: 800;
            color: var(--success-dark);
        }

        .message {
            margin: 0;
            line-height: 1.7;
            color: var(--muted);
            font-size: 1rem;
        }

        .email {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 14px;
            border-radius: 999px;
            background: #ecfdf5;
            color: var(--success-dark);
            font-weight: 700;
            font-size: 0.85rem;
        }

        .btn {
            display: inline-block;
            margin-top: 26px;
            padding: 16px 22px;
            border-radius: 14px;
            text-decoration: none;
            background: linear-gradient(135deg, var(--primary), #312e81);
            color: white;
            font-weight: 700;
            box-shadow: 0 12px 25px rgba(79, 70, 229, 0.18);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">✓</div>
        <h1>Email Verified</h1>
        <p class="message">{{ message }}</p>
        <span class="email">{{ user_email }}</span>
        <br />
        <a href="teamatch://app/login" class="btn">Open app</a>
    </div>
</body>
</html>
